name: Build Python Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag or ref to build (defaults to the branch the workflow is run from)."
        required: false
        type: string
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_FIND_LINKS: https://github.com/xadupre/onnx-light/releases/expanded_assets/0.2.3

# The Python extension links the shared runtime from the onnx-light wheel.
# Linux wheels are built natively on ubuntu-24.04 to keep the C++ ABI compatible.
# macOS wheels match onnx-light's universal2 architectures and deployment target.
#
# When triggered by a tag push (or a workflow_dispatch with a tag), each matrix
# job attaches its wheel to the matching GitHub Release (requires
# contents: write). Other runs only upload the wheels to Actions storage.
jobs:
  build_wheels:
    name: wheel (${{ matrix.artifact_suffix }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        artifact_suffix: [linux-x86_64, linux-aarch64, windows-AMD64, windows-ARM64, macos-universal2]
        python-version: ["3.12", "3.13"]
        include:
          - artifact_suffix: linux-x86_64
            runs-on: ubuntu-24.04
          - artifact_suffix: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - artifact_suffix: windows-AMD64
            runs-on: windows-latest
          - artifact_suffix: windows-ARM64
            runs-on: windows-11-arm
          - artifact_suffix: macos-universal2
            runs-on: macos-latest
            archflags: -arch arm64 -arch x86_64
            deployment_target: "13.0"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: |
          count=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${count}" >> "$GITHUB_ENV"
          echo "CPU count: ${count}"

      - name: Build wheel
        shell: bash
        env:
          CMAKE_ARGS: -DONNX_HARDENING=ON
          ARCHFLAGS: ${{ matrix.archflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Smoke test macOS wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          cd "${RUNNER_TEMP}"
          python -c "from onnx_light_kernel_images.onnx_py._imgpykernels import register_image_kernels; register_image_kernels()"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.artifact_suffix }}-py${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Attach wheel to GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          tag="${tag#refs/tags/}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --title "${tag}" --generate-notes >/dev/null 2>&1 || \
              gh release view "${tag}" >/dev/null 2>&1
          fi
          gh release upload "${tag}" ./wheelhouse/*.whl --clobber
