name: Build Python Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag or ref to build (defaults to the branch the workflow is run from)."
        required: false
        type: string
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Python extension links the prebuilt onnx-light C++ static libraries, which
# onnx-light publishes only for Linux and Windows (macOS has no archive and its
# CMake configure step fails on purpose). Those static libraries are built on
# ubuntu-24.04, so the Linux wheels are built natively on the same distribution
# rather than inside an older manylinux container to keep the C++ ABI compatible.
#
# When triggered by a tag push (or a workflow_dispatch with a tag), each matrix
# job attaches its wheel to the matching GitHub Release (requires
# contents: write). Other runs only upload the wheels to Actions storage.
jobs:
  build_wheels:
    name: wheel (${{ matrix.artifact_suffix }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        artifact_suffix: [linux-x86_64, linux-aarch64, windows-AMD64, windows-ARM64]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - artifact_suffix: linux-x86_64
            runs-on: ubuntu-24.04
          - artifact_suffix: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - artifact_suffix: windows-AMD64
            runs-on: windows-latest
          - artifact_suffix: windows-ARM64
            runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect runner CPU count
        id: cpu_count
        shell: bash
        run: |
          count=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${count}" >> "$GITHUB_ENV"
          echo "CPU count: ${count}"

      - name: Build wheel
        shell: bash
        env:
          CMAKE_ARGS: -DONNX_HARDENING=ON
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.artifact_suffix }}-py${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Attach wheel to GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          tag="${tag#refs/tags/}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --title "${tag}" --notes "" >/dev/null 2>&1 || \
              gh release view "${tag}" >/dev/null 2>&1
          fi
          gh release upload "${tag}" ./wheelhouse/*.whl --clobber
