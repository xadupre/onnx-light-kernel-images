name: ci-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 32 || 25 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # onnx-light ships prebuilt C++ archives only for Linux and Windows.
        # The source-runtime matrix below covers macOS.
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # The ImageDecoder kernel decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries, loaded dynamically at runtime. Install
      # them so those decoders are exercised by the C++ tests.
      - name: Install runtime image codecs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant.
      - name: Build and install package (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      - name: Run Python tests
        run: pytest --durations=10 --cov=onnx_light_kernel_images --cov-report=xml --cov-report=term-missing unittests

      # Upload the Python coverage report so the Codecov badge in the README
      # reflects the current line coverage.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  setup_onnx_light_source:
    name: onnx-light main (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Select Ninja generator (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and install onnx-light from source
        env:
          SCCACHE_GHA_ENABLED: "true"
        shell: bash
        run: |
          pip install nanobind scikit-build-core setuptools numpy pytest matplotlib ml_dtypes onnxruntime openpyxl pandas tqdm
          onnx_light_source="${RUNNER_TEMP}/onnx-light"
          git clone --depth 1 --branch main https://github.com/xadupre/onnx-light.git "${onnx_light_source}"
          CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            CMAKE_ARGS="${CMAKE_ARGS} -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON"
          fi
          export CMAKE_ARGS
          pip install -C build.verbose=true "${onnx_light_source}" -v
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "ONNX_LIGHT_KERNEL_IMAGES_ONNX_LIGHT_IMPLIB_DIR=${onnx_light_source}/build" >> "$GITHUB_ENV"
          fi
          python - <<'PY'
          import os
          from onnx_light import get_cpp_build_info

          variable = {
              "Linux": "LD_LIBRARY_PATH",
              "macOS": "DYLD_LIBRARY_PATH",
              "Windows": "PATH",
          }[os.environ["RUNNER_OS"]]
          library_dir = get_cpp_build_info()["library_dir"]
          current = os.environ.get(variable, "")
          value = library_dir if not current else library_dir + os.pathsep + current
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"{variable}={value}\n")
          PY

      - name: Build extension and run C++ tests via setup.py
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: python setup.py build_ext --inplace --cpp-tests --onnx-light-source

      - name: Run Python image tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q unittests/python/test_image_decoder.py unittests/python/test_image_formats.py
