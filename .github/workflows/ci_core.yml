name: ci-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # macOS gets extra time because onnx-light ships no prebuilt C++ archive for
    # it, so the SDK is compiled from source before the kernel is built.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 32 || (matrix.os == 'macos-latest' && 45 || 25) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # onnx-light ships prebuilt C++ archives only for Linux and Windows, so
        # those platforms download the archive. macOS has no archive, so the
        # onnx-light C++ SDK is built from source and pointed at via
        # ONNX_LIGHT_ROOT before the ImageDecoder kernel is built and tested.
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || true
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # onnx-light publishes no prebuilt C++ archive for macOS, so build and
      # install the 0.1.9 SDK from source and expose it through ONNX_LIGHT_ROOT
      # (the kernel's CMakeLists skips the archive download when it is set).
      - name: Checkout onnx-light source (macOS)
        if: runner.os == 'macOS'
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.1.9"
          path: onnx-light-src

      - name: Build and install onnx-light C++ SDK (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S onnx-light-src -B onnx-light-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNX_LIGHT_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/onnx-light-install"
          cmake --build onnx-light-build --config Release
          cmake --install onnx-light-build --config Release
          echo "ONNX_LIGHT_ROOT=${{ github.workspace }}/onnx-light-install" >> "$GITHUB_ENV"

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant.
      - name: Build and install package (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.ONNX_LIGHT_ROOT="${ONNX_LIGHT_ROOT}" -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      - name: Run Python tests
        run: pytest --durations=10 unittests
