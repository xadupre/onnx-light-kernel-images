name: ci-core

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 32 || 25 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # onnx-light only ships prebuilt C++ archives for Linux and Windows,
        # so the ImageDecoder kernel is built and tested on those platforms.
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Set up MSVC for Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # The ImageDecoder kernel decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries, loaded dynamically at runtime. Install
      # them so those decoders are exercised by the C++ tests.
      - name: Install runtime image codecs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      # sccache caches compiled objects in the GitHub Actions cache so repeated
      # runs that do not touch C++ sources are near-instant.
      - name: Build and install package (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: Build and install package (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C Release --timeout 240

      - name: Run Python tests
        run: pytest --durations=10 --cov=onnx_light_kernel_images --cov-report=xml --cov-report=term-missing unittests

      # Upload the Python coverage report so the Codecov badge in the README
      # reflects the current line coverage.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python-${{ runner.os }}
          name: python-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
