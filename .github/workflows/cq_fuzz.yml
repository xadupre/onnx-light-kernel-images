name: acq - fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "onnx_light_kernel_images/kernels/**"
      - "CMakeLists.txt"
      - ".github/workflows/cq_fuzz.yml"
  push:
    branches:
      - main
    paths:
      - "fuzz/**"
      - "onnx_light_kernel_images/kernels/**"
      - "CMakeLists.txt"
      - ".github/workflows/cq_fuzz.yml"
  schedule:
    # Run daily at 06:00 UTC. The check_recent_commit job below skips the
    # build if no new commit landed on the default branch in the last 24 hours.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last 24 hours.
          recent=$(git log -1 --since='24 hours ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last 24 hours; skipping fuzz smoke build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz_smoke:
    name: fuzz smoke (ubuntu-latest, clang+libFuzzer)
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Clang, Ninja and OpenMP (Linux)
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libomp-dev

      # The ImageDecoder kernel decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries, loaded dynamically at runtime. Install
      # them so those decoders are exercised by the fuzz harnesses.
      - name: Install runtime image codecs (Linux)
        run: sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      - name: Install CMake
        run: pip install --upgrade cmake

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"

      - name: Configure fuzz build (Clang + libFuzzer + AddressSanitizer)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNX_LIGHT_KERNEL_IMAGES_BUILD_FUZZERS=ON \
            -DONNX_LIGHT_KERNEL_IMAGES_BUILD_PYTHON=OFF \
            -DONNX_LIGHT_KERNEL_IMAGES_INSTALL=OFF

      - name: Build fuzz harnesses
        run: |
          cmake --build build-fuzz --target \
            fuzz_image_decoder \
            fuzz_tiff_compression \
            make_seed_corpus

      - name: Generate seed corpora
        run: |
          ./build-fuzz/make_seed_corpus \
            /tmp/fuzz_seeds/image_decoder \
            /tmp/fuzz_seeds/tiff_compression

      - name: Run fuzz_image_decoder (smoke)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./build-fuzz/fuzz_image_decoder /tmp/fuzz_seeds/image_decoder -runs=4000 -timeout=25

      - name: Run fuzz_tiff_compression (smoke)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./build-fuzz/fuzz_tiff_compression /tmp/fuzz_seeds/tiff_compression -runs=4000 -timeout=25
