name: acq - hardening

on:
  schedule:
    # Run daily at 06:30 UTC. The check_recent_commit job below skips the heavy
    # build if no new commit landed on the default branch in the last 24 hours.
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_FIND_LINKS: https://github.com/xadupre/onnx-light/releases/expanded_assets/0.2.2

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last 24 hours.
          recent=$(git log -1 --since='24 hours ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last 24 hours; skipping hardening build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  hardening_tests:
    name: hardening (${{ matrix.os }}, ${{ matrix.compiler }})
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 47
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Clang needs libomp-dev to satisfy onnx-light's find_dependency(OpenMP);
      # unlike GCC (which bundles libgomp), Clang has no OpenMP runtime by
      # default, so configuring onnx-light fails with "Could NOT find OpenMP_CXX".
      - name: Install clang (Linux)
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      # The ImageDecoder kernel decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries, loaded dynamically at runtime. Install
      # them so those decoders are exercised by the C++ tests.
      - name: Install runtime image codecs (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Install onnx-light Python runtime
        run: |
          pip install "onnx-light==0.2.2"
          python - <<'PY'
          import os
          from pathlib import Path
          from onnx_light import get_cpp_build_info

          library_dir = Path(get_cpp_build_info()["library_dir"])
          paths = [str(library_dir), str(library_dir.parent.parent / "onnx_light.libs")]
          paths.append(os.environ.get("LD_LIBRARY_PATH", ""))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LD_LIBRARY_PATH={os.pathsep.join(paths)}\n")
          PY

      - name: Build and install package (Release + ONNX_HARDENING=ON)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          pip install \
            -C build-dir=build \
            -C cmake.build-type=Release \
            -C cmake.define.ONNX_LIGHT_KERNEL_IMAGES_BUILD_TESTS=ON \
            -C cmake.define.ONNX_HARDENING=ON \
            -e .[dev] -v

      - name: pip freeze
        run: pip freeze

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python unit tests
        run: pytest --durations=10 unittests -v
