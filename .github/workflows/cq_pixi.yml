name: acq - pixi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last week.
          recent=$(git log -1 --since='7 days ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last week; skipping pixi validation."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  pixi-tests:
    name: pixi (ubuntu-latest)
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 62
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest
          cache: true
      - name: Run Pixi Python tests
        run: pixi run test-python
