name: acq - pixi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_FIND_LINKS: https://github.com/xadupre/onnx-light/releases/expanded_assets/0.2.3

jobs:
  check_recent_commit:
    name: check recent commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Trigger is ${{ github.event_name }}; running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On scheduled runs, only proceed when a commit was made on the
          # default branch within the last week.
          recent=$(git log -1 --since='7 days ago' --format=%H || true)
          if [ -n "$recent" ]; then
            echo "Recent commit found: $recent"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit in the last week; skipping pixi validation."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  pixi-tests:
    name: pixi (ubuntu-latest)
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 62
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest
          cache: true
      - name: Install onnx-light Python runtime
        run: |
          pixi run --environment default pip install "onnx-light==0.2.3"
          pixi run --environment default python - <<'PY'
          import os
          from pathlib import Path
          from onnx_light import get_cpp_build_info

          library_dir = Path(get_cpp_build_info()["library_dir"])
          paths = [str(library_dir), str(library_dir.parent.parent / "onnx_light.libs")]
          paths.append(os.environ.get("LD_LIBRARY_PATH", ""))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LD_LIBRARY_PATH={os.pathsep.join(paths)}\n")
          PY
      - name: Run Pixi Python tests
        run: pixi run --environment default test-python
