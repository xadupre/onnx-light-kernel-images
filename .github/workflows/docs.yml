name: docs

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read onnx-light version from pyproject.toml
        run: python tools/onnx_light_version.py --github-env

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      # The documentation gallery decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries loaded at runtime; install them so the
      # example exercises those decoders instead of reporting them unavailable.
      - name: Install runtime image codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      # Sphinx-Gallery executes docs/examples/plot_image_formats.py at build
      # time, which runs an ImageDecoder model through onnx-light's
      # ReferenceEvaluator.
      # Use the full released wheel: reduced wheels omit the kernels runtime.
      - name: Install onnx-light Python runtime
        run: |
          python -m pip install "https://github.com/xadupre/onnx-light/releases/download/${ONNX_LIGHT_VERSION}/onnx_light-${ONNX_LIGHT_VERSION}-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          python - <<'PY'
          import os
          from pathlib import Path
          from onnx_light import get_cpp_build_info

          library_dir = Path(get_cpp_build_info()["library_dir"])
          paths = [str(library_dir), str(library_dir.parent.parent / "onnx_light.libs")]
          paths.append(os.environ.get("LD_LIBRARY_PATH", ""))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LD_LIBRARY_PATH={os.pathsep.join(paths)}\n")
          PY

      - name: Install Python build dependencies
        run: python -m pip install "cmake>=4.0" "scikit-build-core>=0.3.3" "nanobind>=1.3.2"

      # Build against the installed full runtime without an isolated environment
      # selecting a reduced wheel, and install the documentation dependencies.
      - name: Build and install package with docs extras
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install --no-build-isolation -C build-dir=build -C cmake.build-type=Release -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[docs] -v

      - name: pip freeze
        run: pip freeze

      # sphinx-build exits non-zero when Sphinx-Gallery fails to execute an
      # example, so this step fails if the documentation stops running.
      - name: Build documentation
        run: sphinx-build -b html docs dist/html

  report_failure:
    name: report documentation failure
    needs: docs
    if: ${{ always() && needs.docs.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly documentation build failed"
          body="The documentation workflow failed. See the logs: ${RUN_URL}"
          issue=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq '.[] | select(.title == "Weekly documentation build failed") | .number' \
            --limit 100 | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
