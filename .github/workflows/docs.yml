name: docs

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_FIND_LINKS: https://github.com/xadupre/onnx-light/releases/expanded_assets/0.2.3

jobs:
  docs:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set parallel build level
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=$(python -c 'import os; print(os.cpu_count() or 1)')
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"

      # The documentation gallery decodes JPEG2000 and WebP through the OpenJPEG
      # and libwebp shared libraries loaded at runtime; install them so the
      # example exercises those decoders instead of reporting them unavailable.
      - name: Install runtime image codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenjp2-7 libwebp7

      # Sphinx-Gallery executes docs/examples/plot_image_formats.py at build
      # time, which runs an ImageDecoder model through onnx-light's
      # ReferenceEvaluator.
      # Use the released Python runtime matching the C++ archive.
      - name: Install onnx-light Python runtime
        run: pip install "onnx-light==0.2.3" -v

      # Build the ImageDecoder kernel (downloads the prebuilt onnx-light 0.2.3
      # C++ archive) and install the documentation dependencies.
      - name: Build and install package with docs extras
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: pip install -C build-dir=build -C cmake.build-type=Release -C cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache -C cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache -e .[docs] -v

      - name: pip freeze
        run: pip freeze

      # sphinx-build exits non-zero when Sphinx-Gallery fails to execute an
      # example, so this step fails if the documentation stops running.
      - name: Build documentation
        run: sphinx-build -b html docs dist/html

  report_failure:
    name: report documentation failure
    needs: docs
    if: ${{ always() && needs.docs.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly documentation build failed"
          body="The documentation workflow failed. See the logs: ${RUN_URL}"
          issue=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq '.[] | select(.title == "Weekly documentation build failed") | .number' \
            --limit 100 | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
