[workspace]
name = "onnx-light-kernel-images"
description = "ImageDecoder kernel for onnx-light"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Conda-only environment (no PyPI mapping required) providing the
# build/runtime/dev/docs dependencies declared in pyproject.toml.
# After running `pixi install`, build/install the package itself with:
#     pixi run pip install --no-build-isolation -e .

[dependencies]
python = ">=3.10"
numpy = ">=2.1"
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
scikit-build-core = ">=0.3.3"
nanobind = ">=1.3.2"
pip = "*"

[feature.dev.dependencies]
pytest = ">=7"
pytest-cov = "*"
ruff = "*"

[feature.docs.dependencies]
pydata-sphinx-theme = "*"
sphinx = ">=7"
sphinx-copybutton = "*"
sphinx-gallery = "*"
myst-parser = "*"
pillow = "*"
matplotlib = "*"

[tasks]
install = "pip install --no-build-isolation -e .[dev]"
test = { cmd = "pytest --durations=10 unittests", depends-on = ["install"] }
test-python = { cmd = "pytest --durations=10 unittests/python", depends-on = ["install"] }
lint = "ruff check . && ruff format --check ."

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
