[build-system]
requires = ["scikit-build-core>=0.3.3", "nanobind>=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "onnx-light-kernel-images"
version = "0.1.0"
description = "ImageDecoder kernel for onnx-light (BMP, TIFF, JPEG, JPEG2000, PNG, WebP, PNM)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pillow",
    "matplotlib",
]
docs = [
    "pydata-sphinx-theme",
    "sphinx>=7",
    "sphinx-copybutton",
    "sphinx-gallery",
    "myst-parser",
    "pillow",
    "matplotlib",
]

[tool.scikit-build]
wheel.packages = ["onnx_light_kernel_images"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.ruff]
exclude = [".eggs", ".git", "build", "dist"]
line-length = 98

[tool.ruff.lint]
select = [
    "B", "C4", "E", "F", "G", "ISC", "LOG", "PIE", "PYI", "RUF",
    "SIM", "SLOT", "T10", "UP", "W", "YTT",
]

[tool.ruff.lint.extend-per-file-ignores]
"**" = ["RUF012", "RUF100", "SIM102", "SIM108", "UP006", "UP007", "UP035"]
"unittests/**" = ["B023", "B904", "E731"]
"docs/examples/**" = ["E402"]
